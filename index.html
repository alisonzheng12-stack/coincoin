
<style>
*{box-sizing:border-box;margin:0;padding:0;}
#game{padding:1rem 0;user-select:none;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1rem;}
.stat{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 8px;text-align:center;}
.stat-label{font-size:12px;color:var(--color-text-secondary);margin-bottom:3px;}
.stat-value{font-size:18px;font-weight:500;color:var(--color-text-primary);}
.top-bar{display:flex;align-items:center;justify-content:flex-end;margin-bottom:0.75rem;gap:6px;}
.lang-btn{padding:5px 12px;font-size:12px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);cursor:pointer;background:none;color:var(--color-text-secondary);}
.lang-btn.active{background:var(--color-background-secondary);color:var(--color-text-primary);font-weight:500;}
.tabs{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap;}
.tab{padding:7px 14px;font-size:13px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);cursor:pointer;background:none;color:var(--color-text-secondary);}
.tab.active{background:var(--color-background-secondary);color:var(--color-text-primary);font-weight:500;}
.panel{display:none;}.panel.show{display:block;}
#coin-btn{width:130px;height:130px;border-radius:50%;background:#FAC775;border:4px solid #EF9F27;font-size:50px;cursor:pointer;transition:transform .08s,box-shadow .08s;box-shadow:0 5px 0 #BA7517;display:inline-flex;align-items:center;justify-content:center;}
#coin-btn:active{transform:scale(0.92) translateY(4px);box-shadow:0 1px 0 #BA7517;}
#coin-btn:hover{transform:scale(1.05);}
.float-text{position:fixed;pointer-events:none;font-weight:500;font-size:17px;color:#27500A;animation:floatUp .9s ease-out forwards;z-index:999;}
@keyframes floatUp{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-75px);}}
#jackpot-banner{background:var(--color-background-warning);color:var(--color-text-warning);border-radius:var(--border-radius-md);padding:8px 14px;font-weight:500;font-size:14px;margin-bottom:10px;display:none;text-align:center;}
.history{max-height:180px;overflow-y:auto;}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;font-size:13px;border-bottom:0.5px solid var(--color-border-tertiary);color:var(--color-text-secondary);}
.history-item .amt{font-weight:500;color:var(--color-text-primary);}
.history-item .amt.big{color:#27500A;}
.history-item .amt.jackpot{color:#D85A30;font-size:15px;}
#reset-btn{font-size:12px;color:var(--color-text-tertiary);background:none;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:5px 12px;cursor:pointer;margin-top:10px;}
.exchange-card{background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:14px 16px;margin-top:1rem;}
.ex-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.ex-label{font-size:13px;font-weight:500;color:var(--color-text-secondary);}
.ex-toggle{display:flex;}
.ex-toggle button{padding:5px 13px;font-size:12px;border:0.5px solid var(--color-border-secondary);cursor:pointer;background:none;color:var(--color-text-secondary);}
.ex-toggle button:first-child{border-radius:var(--border-radius-md) 0 0 var(--border-radius-md);}
.ex-toggle button:last-child{border-radius:0 var(--border-radius-md) var(--border-radius-md) 0;border-left:none;}
.ex-toggle button.active{background:var(--color-background-primary);color:var(--color-text-primary);font-weight:500;}
.ex-body{display:flex;align-items:center;gap:12px;}
.ex-flag{font-size:28px;}
.ex-right{flex:1;}
.ex-amount{font-size:26px;font-weight:500;color:var(--color-text-primary);}
.ex-sub{font-size:11px;color:var(--color-text-secondary);margin-top:3px;}
.afk-card{background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:14px 16px;margin-bottom:1rem;}
.afk-title{font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:10px;}
.duration-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.dur-btn{padding:10px 8px;font-size:13px;font-weight:500;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);cursor:pointer;background:var(--color-background-primary);color:var(--color-text-primary);text-align:center;}
.dur-btn.selected{border-color:#185FA5;background:var(--color-background-info);color:var(--color-text-info);}
.dur-sub{font-size:11px;font-weight:400;color:var(--color-text-secondary);margin-top:2px;}
.dur-btn.selected .dur-sub{color:var(--color-text-info);opacity:0.8;}
.custom-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px;color:var(--color-text-secondary);}
.custom-row input{flex:1;}
#afk-start-btn{width:100%;padding:10px;font-size:14px;font-weight:500;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);cursor:pointer;background:var(--color-background-primary);color:var(--color-text-primary);}
#afk-start-btn.running{border-color:#A32D2D;color:var(--color-text-danger);}
.afk-progress-wrap{margin-top:12px;}
.afk-progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--color-text-secondary);margin-bottom:5px;}
.progress-track{background:var(--color-background-tertiary);border-radius:4px;height:8px;overflow:hidden;}
.progress-fill{height:8px;border-radius:4px;background:#185FA5;transition:width .5s;}
.afk-result{background:var(--color-background-success);border-radius:var(--border-radius-md);padding:10px 14px;margin-top:10px;font-size:13px;color:var(--color-text-success);}
.afk-log{max-height:120px;overflow-y:auto;margin-top:8px;}
.afk-log-item{font-size:12px;color:var(--color-text-secondary);padding:3px 0;border-bottom:0.5px solid var(--color-border-tertiary);}
.ach-filters{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.ach-filter{padding:4px 10px;font-size:12px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);cursor:pointer;background:none;color:var(--color-text-secondary);}
.ach-filter.active{background:var(--color-background-secondary);color:var(--color-text-primary);}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;max-height:340px;overflow-y:auto;}
.ach-item{border-radius:var(--border-radius-md);padding:8px 10px;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);}
.ach-item.unlocked{background:var(--color-background-secondary);}
.ach-item.locked{opacity:0.4;}
.ach-icon{font-size:20px;margin-bottom:3px;}
.ach-name{font-size:12px;font-weight:500;color:var(--color-text-primary);}
.ach-desc{font-size:11px;color:var(--color-text-secondary);margin-top:2px;}
.ach-badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:var(--border-radius-md);margin-top:4px;}
.bclick{background:#E6F1FB;color:#0C447C;}.bmoney{background:#EAF3DE;color:#27500A;}.bjackpot{background:#FAECE7;color:#712B13;}.bstreak{background:#FBEAF0;color:#72243E;}.bspecial{background:#EEEDFE;color:#3C3489;}.bcombo{background:#FAEEDA;color:#633806;}.bafk{background:#E1F5EE;color:#085041;}
.new-ach-toast{position:fixed;bottom:20px;right:20px;background:var(--color-background-primary);border:0.5px solid var(--color-border-success);border-radius:var(--border-radius-lg);padding:10px 14px;font-size:13px;color:var(--color-text-success);z-index:9999;animation:slideIn .3s ease;max-width:240px;}
@keyframes slideIn{from{opacity:0;transform:translateX(30px);}to{opacity:1;transform:translateX(0);}}
</style>

<h2 class="sr-only">點擊硬幣遊戲 / Münzklick-Spiel</h2>
<div id="game">

<div class="top-bar">

  <button class="lang-btn" id="lang-de" onclick="setLang('de')">🇩🇪 Deutsch</button>
</div>

<div class="stat-grid">

</div>

<div class="tabs">
  <button class="tab active" id="tab-game" onclick="switchTab('game')">🪙 點擊</button>
  <button class="tab" id="tab-afk" onclick="switchTab('afk')">⏱️ 掛機</button>
  <button class="tab" id="tab-achievements" onclick="switchTab('achievements')">🏆 成就</button>
  <button class="tab" id="tab-history" onclick="switchTab('history')">📋 紀錄</button>
</div>

<div id="panel-game" class="panel show">
  <div style="text-align:center;padding:.75rem 0;">
    <div id="jackpot-banner">🎉 JACKPOT！</div>
    <button id="coin-btn" aria-label="點擊硬幣">🪙</button>
    <p id="coin-hint" style="font-size:12px;color:var(--color-text-secondary);margin-top:8px;">點擊硬幣來賺錢！</p>
    <div id="combo-display" style="font-size:12px;color:var(--color-text-secondary);min-height:16px;"></div>
  </div>
  <div class="exchange-card">
    <div class="ex-header">
      <span class="ex-label" id="lbl-exchange">💱 兌換試算</span>
      <div class="ex-toggle">
        <button id="btn-twd" class="active" onclick="setCurrency('twd')">🇹🇼 TWD</button>
        <button id="btn-eur" onclick="setCurrency('eur')">🇪🇺 EUR</button>
      </div>
    </div>
    <div class="ex-body">
      <div class="ex-flag" id="ex-flag">🇹🇼</div>
      <div class="ex-right">
        <div class="ex-amount" id="ex-amount">NT$0</div>
        <div class="ex-sub" id="ex-sub"></div>
      </div>
    </div>
  </div>
  <button id="reset-btn" onclick="resetGame()">重置遊戲</button>
</div>

<div id="panel-afk" class="panel">
  <div class="afk-card">
    <div class="afk-title" id="lbl-afk-title">⏱️ 掛機時長設定</div>
    <div class="duration-grid">
      <button class="dur-btn selected" id="dur-0" onclick="selectPreset(0,1500)">25 <span id="lbl-min">分鐘</span><div class="dur-sub" id="lbl-dur0-sub">快速掛機</div></button>
      <button class="dur-btn" id="dur-1" onclick="selectPreset(1,3600)">1 <span id="lbl-hr">小時</span><div class="dur-sub" id="lbl-dur1-sub">穩定收益</div></button>
      <button class="dur-btn" id="dur-2" onclick="selectPreset(2,-1)" id="dur-2"><span id="lbl-custom">自訂</span><div class="dur-sub" id="lbl-dur2-sub">隨你決定</div></button>
    </div>
    <div class="custom-row" id="custom-row" style="display:none;">
      <label id="lbl-duration">時長：</label>
      <input type="range" id="custom-dur" min="60" max="7200" step="60" value="600">
      <span id="custom-dur-label">10 分鐘</span>
    </div>
    <button id="afk-start-btn" onclick="toggleAfk()">▶ 開始掛機</button>
    <div class="afk-progress-wrap" id="afk-progress-wrap" style="display:none;">
      <div class="afk-progress-label">
        <span id="afk-progress-text"></span>
        <span id="afk-progress-pct">0%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="afk-bar" style="width:0%"></div></div>
    </div>
  </div>
  <div id="afk-result" style="display:none;" class="afk-result"></div>
  <div class="afk-log" id="afk-log"></div>
</div>

<div id="panel-achievements" class="panel">
  <div class="ach-filters" id="ach-filters"></div>
  <div class="ach-grid" id="ach-grid"></div>
</div>

<div id="panel-history" class="panel">
  <div class="history" id="history-list"></div>
</div>
</div>

function updateExchange(){
  const L=T[lang];
  const twd=state.total/100000;
  const eur=twd/EUR_TWD;
  if(currency==='twd'){
    document.getElementById('ex-flag').textContent='🇹🇼';
    document.getElementById('ex-amount').textContent='NT$'+Math.floor(twd);
    document.getElementById('ex-sub').textContent=L.exSubTwd+'  |  '+L.exRate.replace('{r}',EUR_TWD.toFixed(2));
  } else {
    document.getElementById('ex-flag').textContent='🇪🇺';
    document.getElementById('ex-amount').textContent='€'+(eur<0.01?eur.toFixed(5):eur<1?eur.toFixed(4):eur.toFixed(2));
    document.getElementById('ex-sub').textContent=L.exSubEur.replace('{r}',(1/EUR_TWD).toFixed(4))+'  |  '+L.exRate.replace('{r}',EUR_TWD.toFixed(2));
  }
}

function updateStats(){
  document.getElementById('total').textContent='$'+fmt(state.total);

  document.getElementById('ach-count').textContent=unlocked.size+'/103';
  document.getElementById('best').textContent='$'+fmt(state.bestSingle);
  updateExchange();
}

async function fetchRate(){
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:60,messages:[{role:'user',content:'Reply ONLY with JSON {"rate":36.6} where rate is current EUR/TWD exchange rate.'}]})});
    const d=await r.json();
    const m=d.content[0].text.match(/\{[^}]+\}/);
    if(m){const j=JSON.parse(m[0]);if(j.rate>30&&j.rate<50){EUR_TWD=j.rate;updateStats();}}
  }catch(e){}
}

function doClick(isAfk=false,x=0,y=0){
  let amount,r=Math.random();
  if(r<0.01)amount=Math.floor(Math.random()*9001)+1000;
  else if(r<0.08)amount=Math.floor(Math.random()*91)+50;
  else if(r<0.35)amount=Math.floor(Math.random()*19)+10;
  else amount=Math.floor(Math.random()*8)+1;
  state.total+=amount;state.clicks++;
  if(amount>state.bestSingle)state.bestSingle=amount;
  if(amount===1)state.gotOneDollar=true;
  if(amount===100)state.exactHundred=true;
  if(state.clicks<=3){state.first3amounts.push(amount);if(state.clicks===3)state.first3done=true;}
  if(state.clicks<=10&&state.total>=500)state.richIn10=true;
  if(state.clicks<=5&&amount>=1000)state.jackpotIn5=true;
  let now=Date.now();
  if(state.lastClickTime>0){let gap=(now-state.lastClickTime)/1000;if(gap>30)state.slowClick=true;if(gap>120)state.verySlowClick=true;}
  state.recentClickTimes.push(now);state.recentClickTimes=state.recentClickTimes.filter(t=>now-t<3000);
  if(state.recentClickTimes.length>=5)state.fastClick=true;
  state.lastClickTime=now;
  let isJackpot=amount>=1000;
  if(isJackpot){
    state.jackpots++;state.jackpotTotal+=amount;state.jackpotStreak++;state.consecutiveJackpots++;
    if(isAfk)state.afkJackpots++;
    let min=Math.floor(Date.now()/60000);
    if(min===state.lastJackpotMinute)state.sameMinuteJackpot++;else{state.sameMinuteJackpot=1;state.lastJackpotMinute=min;}
    let banner=document.getElementById('jackpot-banner');banner.style.display='block';setTimeout(()=>banner.style.display='none',1500);
  }else{state.jackpotStreak=0;state.consecutiveJackpots=0;}
  if(amount>=1)state.streak++;else state.streak=0;
  if(amount>=5)state.fivePlusStreak++;else state.fivePlusStreak=0;
  if(amount>=10)state.tenPlusStreak++;else state.tenPlusStreak=0;
  if(!isAfk&&x&&y){
    let el=document.createElement('div');el.className='float-text';el.style.left=x+'px';el.style.top=y+'px';
    el.textContent='+$'+amount+(isJackpot?' 🎉':'');document.body.appendChild(el);setTimeout(()=>el.remove(),900);
    let combo=document.getElementById('combo-display');
    combo.textContent=state.streak>=5?T[lang].combo.replace('{n}',state.streak):'';
  }
  history.unshift({amount,time:new Date().toLocaleTimeString(lang==='de'?'de-DE':'zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),src:isAfk?T[lang].afkSrc:'click'});
  if(history.length>50)history.pop();
  if(isAfk){afkEarned+=amount;if(isJackpot)afkJacks++;}
  checkAchievements();updateStats();
  if(currentTab==='history')renderHistory();
}

document.getElementById('coin-btn').addEventListener('click',e=>{
  let r=e.target.getBoundingClientRect();doClick(false,r.left+r.width/2-20,r.top-10);
});

function checkAchievements(){
  achievements.forEach(a=>{
    if(!unlocked.has(a.id)&&a.check(state)){
      unlocked.add(a.id);state.unlockedCount=unlocked.size;
      let nm=a[lang]?a[lang].name:a.zh.name;
      let t2=document.createElement('div');t2.className='new-ach-toast';
      t2.textContent='🏆 '+nm+(lang==='zh'?' 解鎖！':' freigeschaltet!');
      document.body.appendChild(t2);setTimeout(()=>t2.remove(),3000);
      if(currentTab==='achievements')renderAchievements();
    }
  });
}

function renderAchFilters(){
  const cats=T[lang].cats;
  document.getElementById('ach-filters').innerHTML=Object.entries(cats).map(([k,v])=>
    `<button class="ach-filter ${currentFilter===k?'active':''}" onclick="setFilter('${k}')">${v}</button>`
  ).join('');
}

function renderAchievements(){
  renderAchFilters();
  const achCats=T[lang].achCats;
  let list=currentFilter==='all'?achievements:achievements.filter(a=>a.cat===currentFilter);
  document.getElementById('ach-grid').innerHTML=list.map(a=>{
    let nm=a[lang]?a[lang].name:a.zh.name;
    let desc=a[lang]?a[lang].desc:a.zh.desc;
    return `<div class="ach-item ${unlocked.has(a.id)?'unlocked':'locked'}">
      <div class="ach-icon">${a.icon}</div>
      <div class="ach-name">${nm}</div>
      <div class="ach-desc">${desc}</div>
      <span class="ach-badge ${a.badge}">${achCats[a.cat]||a.cat}</span>
    </div>`;
  }).join('');
}

function setFilter(f){
  currentFilter=f;renderAchievements();
}

function updateCustomLabel(){
  let v=parseInt(document.getElementById('custom-dur').value);
  let m=Math.floor(v/60),s=v%60;
  let L=T[lang];
  document.getElementById('custom-dur-label').textContent=m>0?m+' '+L.min+(s>0?' '+s+'s':''):v+'s';
}

function selectPreset(idx,secs){
  [0,1,2].forEach(i=>document.getElementById('dur-'+i).classList.toggle('selected',i===idx));
  document.getElementById('custom-row').style.display=idx===2?'flex':'none';
  if(secs>0)afkDuration=secs;else afkDuration=parseInt(document.getElementById('custom-dur').value);
}
document.getElementById('custom-dur').addEventListener('input',function(){
  afkDuration=parseInt(this.value);updateCustomLabel();
});

function toggleAfk(){
  const L=T[lang];
  if(afkTimer){
    clearInterval(afkTimer);afkTimer=null;
    let btn=document.getElementById('afk-start-btn');btn.textContent=L.startAfk;btn.classList.remove('running');
    document.getElementById('afk-progress-wrap').style.display='none';showAfkResult();return;
  }
  afkElapsed=0;afkEarned=0;afkJacks=0;
  document.getElementById('afk-result').style.display='none';document.getElementById('afk-log').innerHTML='';
  let btn=document.getElementById('afk-start-btn');btn.textContent=L.stopAfk;btn.classList.add('running');
  document.getElementById('afk-progress-wrap').style.display='block';document.getElementById('afk-bar').style.width='0%';
  afkTimer=setInterval(()=>{
    afkElapsed++;
    let pct=Math.min(100,Math.round(afkElapsed/afkDuration*100));
    document.getElementById('afk-bar').style.width=pct+'%';document.getElementById('afk-progress-pct').textContent=pct+'%';
    let rem=afkDuration-afkElapsed,h=Math.floor(rem/3600),m=Math.floor((rem%3600)/60),s=rem%60;
    document.getElementById('afk-progress-text').textContent=T[lang].afkRunning+(h>0?h+'h ':'')+m+'m '+s+'s';
    doClick(true);
    let lastAmt=history[0]?.amount;
    let logEl=document.getElementById('afk-log');
    let item=document.createElement('div');item.className='afk-log-item';
    item.textContent=new Date().toLocaleTimeString(lang==='de'?'de-DE':'zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+' +$'+lastAmt+(lastAmt>=1000?' 🎉':'');
    logEl.insertBefore(item,logEl.firstChild);if(logEl.children.length>20)logEl.removeChild(logEl.lastChild);
    if(afkElapsed>=afkDuration){clearInterval(afkTimer);afkTimer=null;btn.textContent=T[lang].startAfk;btn.classList.remove('running');showAfkResult();}
  },1000);
}

function showAfkResult(){
  state.afkSessions++;state.afkTotalSecs+=afkElapsed;state.afkTotalEarned+=afkEarned;
  if(afkEarned>state.afkMaxSession)state.afkMaxSession=afkEarned;
  let el=document.getElementById('afk-result');el.style.display='block';
  let L=T[lang];
  el.textContent=L.afkDone.replace('{s}',afkElapsed).replace('{e}',fmt(afkEarned))+(afkJacks>0?L.afkJacks.replace('{n}',afkJacks):'');
  checkAchievements();updateStats();
}

function renderHistory(){
  const L=T[lang];
  document.getElementById('history-list').innerHTML=history.slice(0,30).map(h=>{
    let cls=h.amount>=1000?'jackpot':h.amount>=50?'big':'';
    let label=h.amount>=1000?L.jackpotLabel:h.amount>=50?L.lucky:L.normal;
    let src=h.src!=='click'?`<span style="font-size:10px;background:var(--color-background-success);color:var(--color-text-success);padding:1px 5px;border-radius:4px;margin-right:4px;">${h.src}</span>`:'';
    return `<div class="history-item"><span>${src}${h.time} — ${label}</span><span class="amt ${cls}">$${fmt(h.amount)}</span></div>`;
  }).join('');
}

function switchTab(tab){
  currentTab=tab;state.tabSwitches++;
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',['game','afk','achievements','history'][i]===tab));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show'));
  document.getElementById('panel-'+tab).classList.add('show');
  if(tab==='achievements')renderAchievements();
  if(tab==='history')renderHistory();
}

function resetGame(){
  if(afkTimer){clearInterval(afkTimer);afkTimer=null;}
  state={total:0,clicks:0,bestSingle:0,jackpots:0,streak:0,tenPlusStreak:0,fivePlusStreak:0,jackpotStreak:0,fastClick:false,exactHundred:false,slowClick:false,verySlowClick:false,tabSwitches:0,gotOneDollar:false,resets:(state.resets||0)+1,sameMinuteJackpot:0,richIn10:false,jackpotIn5:false,jackpotTotal:0,first3done:false,unlockedCount:0,lastJackpotMinute:-1,lastClickTime:0,consecutiveJackpots:0,first3amounts:[],recentClickTimes:[],afkSessions:0,afkTotalSecs:0,afkMaxSession:0,afkTotalEarned:0,afkJackpots:0};
  history=[];unlocked.clear();afkEarned=0;afkJacks=0;afkElapsed=0;
  document.getElementById('jackpot-banner').style.display='none';
  document.getElementById('combo-display').textContent='';
  document.getElementById('afk-progress-wrap').style.display='none';
  document.getElementById('afk-result').style.display='none';
  document.getElementById('afk-start-btn').textContent=T[lang].startAfk;
  document.getElementById('afk-start-btn').classList.remove('running');
  document.getElementById('afk-log').innerHTML='';
  if(currentTab==='history')renderHistory();
  if(currentTab==='achievements')renderAchievements();
  updateStats();
}

applyLang();
updateStats();
renderAchievements();
fetchRate();
</script>
