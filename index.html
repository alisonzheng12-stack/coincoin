<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="硬幣">
<meta name="theme-color" content="#c8870a">
<title>硬幣點擊遊戲</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=DotGothic16&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
:root{
  --bg:#0e0900;--bg2:#1a1108;--bg3:#241810;
  --gold:#e8a020;--gold2:#f5c842;--gold3:#ffd96a;
  --text:#f0d88a;--text2:#b89040;--text3:#7a5c20;
  --green:#2a7a3a;--green2:#3aaa50;--green3:#60cc70;
  --red:#8a2020;--red2:#cc3030;
  --border:#3a2808;--border2:#5a3c10;
  --panel:#1a1108;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;}
body{display:flex;flex-direction:column;height:100dvh;}

/* PIXEL SCANLINE BG */
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.15) 3px,rgba(0,0,0,.15) 4px);pointer-events:none;z-index:0;}

#app{display:flex;flex-direction:column;height:100%;padding-top:var(--safe-top);padding-bottom:var(--safe-bot);position:relative;z-index:1;}

/* TOP BAR */
.topbar{background:var(--bg2);border-bottom:2px solid var(--border2);padding:8px 12px 6px;flex-shrink:0;}
.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;}
.stat-box{background:var(--bg3);border:1px solid var(--border2);border-radius:4px;padding:5px 4px;text-align:center;}
.stat-label{font-size:13px;color:var(--text3);letter-spacing:.5px;font-family:'DotGothic16',monospace;}
.stat-val{font-size:18px;font-weight:700;color:var(--gold2);font-family:'DotGothic16',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stat-val.twd{color:var(--green3);}

/* TABS */
.tabs{display:flex;background:var(--bg2);border-bottom:2px solid var(--border2);flex-shrink:0;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:1;min-width:60px;padding:12px 4px;font-size:17px;text-align:center;cursor:pointer;color:var(--text3);font-family:'DotGothic16',monospace;border:none;background:none;border-bottom:2px solid transparent;transition:all .15s;-webkit-tap-highlight-color:transparent;}
.tab.active{color:var(--gold2);border-bottom-color:var(--gold);}

/* PANELS */
.panels{flex:1;overflow:hidden;position:relative;}
.panel{position:absolute;inset:0;overflow-y:auto;display:none;padding:12px;}
.panel.show{display:block;}
.panel::-webkit-scrollbar{width:3px;}
.panel::-webkit-scrollbar-thumb{background:var(--border2);}

/* GAME PANEL */
#panel-game{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:16px 12px;}
#panel-game.show{display:flex;}

#jackpot-banner{background:var(--gold);color:#1a0900;font-family:'DotGothic16',monospace;font-size:17px;font-weight:700;padding:6px 20px;border-radius:4px;margin-bottom:8px;display:none;animation:flashIn .3s ease;}
@keyframes flashIn{0%{transform:scale(.8);opacity:0;}60%{transform:scale(1.1);}100%{transform:scale(1);opacity:1;}}

.coin-wrap{position:relative;margin:8px 0 4px;}
#coin-btn{
  width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle at 38% 35%, #ffe88a, #e8a020 55%, #8a5008);
  border:4px solid #7a4005;
  font-size:0;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  box-shadow:0 6px 0 #3a2000, 0 8px 16px rgba(0,0,0,.6);
  transition:transform .06s,box-shadow .06s;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
#coin-btn:active{transform:scale(.92) translateY(5px);box-shadow:0 1px 0 #3a2000,0 2px 8px rgba(0,0,0,.6);}
#coin-btn canvas{width:110px;height:110px;}
.coin-ring{position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,220,80,.3);pointer-events:none;}

.combo-bar{height:18px;font-family:'DotGothic16',monospace;font-size:15px;color:var(--gold3);text-align:center;margin:2px 0;}
.tap-hint{font-size:14px;color:var(--text3);font-family:'DotGothic16',monospace;text-align:center;margin-bottom:8px;}

.mini-history{width:100%;max-width:320px;margin-top:8px;}
.mini-hist-item{display:flex;justify-content:space-between;font-size:15px;font-family:'DotGothic16',monospace;padding:3px 8px;border-bottom:1px solid var(--border);color:var(--text2);}
.mini-hist-item .mh-amt{font-weight:700;}
.mini-hist-item .mh-amt.big{color:var(--gold2);}
.mini-hist-item .mh-amt.jp{color:#ff9944;}

#reset-btn{margin-top:auto;font-size:17px;color:var(--text3);background:none;border:1px solid var(--border2);border-radius:4px;padding:6px 14px;cursor:pointer;font-family:'DotGothic16',monospace;}

/* FLOAT TEXT */
.float-txt{position:fixed;pointer-events:none;font-family:'DotGothic16',monospace;font-weight:700;font-size:26px;color:var(--gold3);z-index:999;animation:floatUp .85s ease-out forwards;text-shadow:0 1px 4px rgba(0,0,0,.8);}
@keyframes floatUp{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-80px);}}

/* AFK PANEL */
.card{background:var(--bg2);border:1px solid var(--border2);border-radius:6px;padding:14px;margin-bottom:12px;}
.card-title{font-family:'DotGothic16',monospace;font-size:17px;color:var(--gold2);margin-bottom:12px;}
.dur-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.dur-btn{background:var(--bg3);border:1px solid var(--border2);border-radius:4px;padding:12px 4px;text-align:center;cursor:pointer;color:var(--text2);font-family:'DotGothic16',monospace;font-size:19px;transition:all .15s;}
.dur-btn .dsub{font-size:13px;color:var(--text3);margin-top:2px;}
.dur-btn.sel{background:#3a2808;border-color:var(--gold);color:var(--gold2);}
.dur-btn.sel .dsub{color:var(--text2);}
.custom-row{display:flex;align-items:center;gap:10px;padding:8px;background:var(--bg3);border-radius:4px;margin-bottom:12px;}
.custom-row label{font-size:14px;color:var(--text3);font-family:'DotGothic16',monospace;white-space:nowrap;}
.custom-row input[type=range]{flex:1;accent-color:var(--gold);}
.custom-row span{font-size:17px;font-family:'DotGothic16',monospace;color:var(--text);min-width:50px;text-align:right;}
.afk-btn{width:100%;padding:12px;font-size:17px;font-family:'DotGothic16',monospace;border-radius:4px;cursor:pointer;border:2px solid var(--border2);background:var(--bg3);color:var(--text);transition:all .15s;}
.afk-btn.running{background:var(--red);border-color:var(--red2);color:#fff;}
.prog-bg{background:var(--bg3);border:1px solid var(--border2);border-radius:20px;height:12px;overflow:hidden;margin:8px 0;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold3));transition:width .5s linear;width:0%;}
.afk-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;}
.afk-st{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:7px;text-align:center;}
.afk-st-l{font-size:13px;color:var(--text3);font-family:'DotGothic16',monospace;}
.afk-st-v{font-size:17px;font-weight:700;color:var(--gold2);font-family:'DotGothic16',monospace;margin-top:2px;}
.afk-log{max-height:120px;overflow-y:auto;margin-top:8px;border-top:1px solid var(--border);}
.afk-log-row{display:flex;justify-content:space-between;font-size:14px;font-family:'DotGothic16',monospace;padding:3px 0;color:var(--text3);}
.afk-log-row .la{color:var(--text);font-weight:700;}
.afk-log-row .la.big{color:var(--gold2);}
.afk-log-row .la.jp{color:#ff9944;}
.result-card{background:#0a2010;border:1px solid var(--green2);border-radius:6px;padding:12px;margin-top:10px;display:none;}
.result-title{font-family:'DotGothic16',monospace;font-size:19px;color:var(--green3);margin-bottom:8px;}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.result-stat .rv{font-size:19px;font-weight:700;color:var(--green3);font-family:'DotGothic16',monospace;text-align:center;}
.result-stat .rl{font-size:13px;color:var(--text3);font-family:'DotGothic16',monospace;text-align:center;margin-top:2px;}

/* EXCHANGE */
.rate-tag{display:inline-block;background:#2a1a00;border:1px solid var(--gold);border-radius:20px;padding:4px 10px;font-size:17px;color:var(--gold2);font-family:'DotGothic16',monospace;margin-bottom:10px;}
.twd-banner{display:flex;justify-content:space-between;align-items:center;background:#0a2010;border:1px solid var(--green2);border-radius:4px;padding:10px 12px;margin-bottom:10px;}
.twd-banner .tl{font-size:15px;color:var(--green3);font-family:'DotGothic16',monospace;}
.twd-banner .tv{font-size:26px;font-weight:700;color:var(--green3);font-family:'DotGothic16',monospace;}
.ex-balrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.ex-bal{background:var(--bg3);border:1px solid var(--border2);border-radius:4px;padding:10px;}
.ex-bal-l{font-size:13px;color:var(--text3);font-family:'DotGothic16',monospace;}
.ex-bal-v{font-size:19px;font-weight:700;color:var(--gold2);font-family:'DotGothic16',monospace;margin-top:3px;}
.ex-bal-v.tw{color:var(--green3);}
.ex-inp-row{display:flex;gap:8px;margin-bottom:8px;}
.ex-inp-row input{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:4px;padding:10px 10px;font-size:17px;color:var(--text);font-family:'DotGothic16',monospace;}
.ex-inp-row input:focus{outline:none;border-color:var(--gold);}
.ex-max-btn{background:var(--bg3);border:1px solid var(--border2);border-radius:4px;padding:10px 12px;font-size:15px;color:var(--text2);font-family:'DotGothic16',monospace;cursor:pointer;}
.ex-preview{font-size:14px;color:var(--text3);font-family:'DotGothic16',monospace;min-height:16px;margin-bottom:10px;}
.ex-preview span{color:var(--green3);}
.ex-do-btn{width:100%;padding:12px;font-size:17px;font-family:'DotGothic16',monospace;border-radius:4px;cursor:pointer;border:2px solid var(--green2);background:#0a2010;color:var(--green3);transition:all .15s;}
.ex-do-btn:disabled{opacity:.35;cursor:not-allowed;}
.ex-do-btn:not(:disabled):active{background:#0d3018;}
.ex-hist{margin-top:10px;border-top:1px solid var(--border);padding-top:8px;}
.ex-hist-title{font-size:13px;color:var(--text3);font-family:'DotGothic16',monospace;margin-bottom:6px;}
.ex-hist-row{display:flex;justify-content:space-between;font-size:17px;font-family:'DotGothic16',monospace;padding:4px 0;border-bottom:1px solid var(--border);color:var(--text3);}
.ex-hist-row .eha{color:var(--green3);font-weight:700;}

/* ACHIEVEMENTS */
.ach-filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.af-btn{padding:4px 10px;font-size:17px;border-radius:20px;border:1px solid var(--border2);cursor:pointer;background:none;color:var(--text3);font-family:'DotGothic16',monospace;}
.af-btn.active{background:#3a2808;color:var(--gold2);border-color:var(--gold);}
.ach-prog-txt{font-size:14px;color:var(--text3);font-family:'DotGothic16',monospace;margin-bottom:8px;}
.ach-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}
.ach-card{background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:10px;}
.ach-card.unlocked{border-color:var(--green2);background:#0a1a08;}
.ach-card.unlocked .an{color:var(--green3);}
.ach-card.locked .ai{filter:grayscale(1);opacity:.3;}
.ai{font-size:26px;margin-bottom:3px;}
.an{font-size:15px;font-weight:700;color:var(--text);font-family:'DotGothic16',monospace;line-height:1.3;}
.ad{font-size:13px;color:var(--text3);line-height:1.4;margin-top:2px;}
.ab{font-size:12px;padding:2px 6px;border-radius:10px;display:inline-block;margin-top:4px;font-family:'DotGothic16',monospace;}
.bclick{background:#0a1a3a;color:#6ab0ff;}
.bmoney{background:#0a2010;color:var(--green3);}
.bjackpot{background:#2a0800;color:#ff8844;}
.bstreak{background:#200a1a;color:#ff88cc;}
.bspecial{background:#1a0a2a;color:#cc88ff;}
.bcombo{background:#1a1400;color:#ffcc44;}
.bafk{background:#0a2a1a;color:#44ffaa;}

/* HISTORY */
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-family:'DotGothic16',monospace;font-size:15px;color:var(--text3);}
.hist-amt{font-weight:700;color:var(--text);}
.hist-amt.big{color:var(--gold2);}
.hist-amt.jp{color:#ff9944;}
.hist-tag{font-size:12px;background:#0a2010;color:var(--green3);border:1px solid var(--green);padding:1px 5px;border-radius:3px;margin-right:4px;}

/* TOAST */
.toast{position:fixed;top:calc(var(--safe-top) + 60px);left:50%;transform:translateX(-50%);background:var(--bg2);border:2px solid var(--gold);border-radius:6px;padding:10px 16px;font-family:'DotGothic16',monospace;font-size:16px;color:var(--gold2);z-index:9999;white-space:nowrap;animation:toastIn .3s ease;pointer-events:none;}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-10px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.toast.green{border-color:var(--green2);color:var(--green3);}

/* INSTALL BANNER */
#install-banner{display:none;background:var(--bg2);border-top:2px solid var(--gold);padding:10px 14px;flex-shrink:0;display:none;align-items:center;gap:10px;}
#install-banner.show{display:flex;}
#install-banner p{flex:1;font-size:17px;color:var(--text2);font-family:'DotGothic16',monospace;}
#install-btn{background:var(--gold);color:#1a0900;border:none;border-radius:4px;padding:7px 14px;font-size:15px;font-family:'DotGothic16',monospace;cursor:pointer;font-weight:700;}
#dismiss-install{background:none;border:none;color:var(--text3);font-size:26px;cursor:pointer;padding:0 4px;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="stat-row">
      <div class="stat-box"><div class="stat-label">💰金額</div><div class="stat-val" id="s-total">$0</div></div>
      <div class="stat-box"><div class="stat-label">🖱️點擊</div><div class="stat-val" id="s-clicks">0</div></div>
      <div class="stat-box"><div class="stat-label">🏆成就</div><div class="stat-val" id="s-ach">0/103</div></div>
      <div class="stat-box"><div class="stat-label">🇹🇼台幣</div><div class="stat-val twd" id="s-twd">NT$0</div></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('game')">🪙點擊</button>
    <button class="tab" onclick="switchTab('afk')">⏱掛機</button>
    <button class="tab" onclick="switchTab('exchange')">💱兌換</button>
    <button class="tab" onclick="switchTab('ach')">🏆成就</button>
    <button class="tab" onclick="switchTab('hist')">📋紀錄</button>
  </div>

  <div class="panels">
    <!-- GAME -->
    <div id="panel-game" class="panel show">
      <div id="jackpot-banner">🎉 JACKPOT！大獎！</div>
      <div class="coin-wrap">
        <button id="coin-btn" aria-label="點擊硬幣">
          <canvas id="coin-canvas" width="110" height="110"></canvas>
        </button>
        <div class="coin-ring"></div>
      </div>
      <div class="combo-bar" id="combo-bar"></div>
      <div class="tap-hint">點擊硬幣來賺錢！</div>
      <div class="mini-history" id="mini-history"></div>
      <button id="reset-btn" onclick="resetGame()">重置遊戲</button>
    </div>

    <!-- AFK -->
    <div id="panel-afk" class="panel">
      <div class="card">
        <div class="card-title">⏱ 掛機時長設定</div>
        <div class="dur-grid">
          <button class="dur-btn sel" id="dur-0" onclick="selPreset(0,1500)">25分鐘<div class="dsub">快速掛機</div></button>
          <button class="dur-btn" id="dur-1" onclick="selPreset(1,3600)">1小時<div class="dsub">穩定收益</div></button>
          <button class="dur-btn" id="dur-2" onclick="selPreset(2,-1)">自訂<div class="dsub">隨你決定</div></button>
        </div>
        <div class="custom-row" id="custom-row" style="display:none">
          <label>時長：</label>
          <input type="range" id="custom-dur" min="60" max="7200" step="60" value="600" oninput="updateCustomLbl()">
          <span id="custom-lbl">10分鐘</span>
        </div>
        <button class="afk-btn" id="afk-btn" onclick="toggleAfk()">▶ 開始掛機</button>
        <div id="afk-prog-wrap" style="display:none;margin-top:10px;">
          <div style="display:flex;justify-content:space-between;font-size:14px;color:var(--text3);font-family:'DotGothic16',monospace;">
            <span id="afk-status">掛機中...</span><span id="afk-left"></span>
          </div>
          <div class="prog-bg"><div class="prog-fill" id="prog-fill"></div></div>
          <div class="afk-stats">
            <div class="afk-st"><div class="afk-st-l">本次收入</div><div class="afk-st-v" id="afk-earn">$0</div></div>
            <div class="afk-st"><div class="afk-st-l">已過時間</div><div class="afk-st-v" id="afk-el">0s</div></div>
            <div class="afk-st"><div class="afk-st-l">大獎次數</div><div class="afk-st-v" id="afk-jk">0</div></div>
          </div>
          <div class="afk-log" id="afk-log"></div>
        </div>
      </div>
      <div class="result-card" id="result-card">
        <div class="result-title">✅ 掛機結算完成！</div>
        <div class="result-grid">
          <div class="result-stat"><div class="rv" id="res-earn">$0</div><div class="rl">總收入</div></div>
          <div class="result-stat"><div class="rv" id="res-ticks">0</div><div class="rl">收穫次數</div></div>
          <div class="result-stat"><div class="rv" id="res-jk">0</div><div class="rl">大獎次數</div></div>
        </div>
      </div>
    </div>

    <!-- EXCHANGE -->
    <div id="panel-exchange" class="panel">
      <div class="card">
        <div class="rate-tag">💱 匯率：每 $100,000 = NT$1</div>
        <div class="twd-banner">
          <span class="tl">🇹🇼 累計兌換台幣</span>
          <span class="tv" id="twd-total">NT$0</span>
        </div>
        <div class="ex-balrow">
          <div class="ex-bal"><div class="ex-bal-l">💰 可用遊戲金額</div><div class="ex-bal-v" id="ex-balance">$0</div></div>
          <div class="ex-bal"><div class="ex-bal-l">🇹🇼 可兌換台幣</div><div class="ex-bal-v tw" id="ex-conv">NT$0</div></div>
        </div>
        <div class="ex-inp-row">
          <input type="number" id="ex-input" inputmode="numeric" placeholder="輸入兌換台幣數量" oninput="updateExPrev()">
          <button class="ex-max-btn" onclick="exMax()">最大</button>
        </div>
        <div class="ex-preview" id="ex-prev">請輸入兌換數量</div>
        <button class="ex-do-btn" id="ex-btn" onclick="doExchange()" disabled>兌換</button>
        <div class="ex-hist" id="ex-hist" style="display:none">
          <div class="ex-hist-title">兌換紀錄</div>
          <div id="ex-hist-list"></div>
        </div>
      </div>
    </div>

    <!-- ACHIEVEMENTS -->
    <div id="panel-ach" class="panel">
      <div class="ach-filter-row" id="ach-filters"></div>
      <div class="ach-prog-txt" id="ach-prog"></div>
      <div class="ach-grid" id="ach-grid"></div>
    </div>

    <!-- HISTORY -->
    <div id="panel-hist" class="panel">
      <div id="hist-list"></div>
    </div>
  </div>

  <div id="install-banner">
    <p>加入主畫面，隨時快速啟動！</p>
    <button id="install-btn">加入</button>
    <button id="dismiss-install" onclick="document.getElementById('install-banner').classList.remove('show')">✕</button>
  </div>
</div>

<script>
// ── PIXEL COIN CANVAS ──────────────────────────────────
(function(){
  const c = document.getElementById('coin-canvas');
  if(!c) return;
  const ctx = c.getContext('2d');
  const W = 110, GRID = 32, S = W/GRID;

  function px(x,y,col){
    ctx.fillStyle = col;
    ctx.fillRect(Math.floor(x*S), Math.floor(y*S), Math.ceil(S), Math.ceil(S));
  }

  const DARK='#5a3700', SHADOW='#a06400', MID='#d29614', GOLD='#f0b91e',
        LIGHT='#ffd84a', SHINE='#fff0a0', WHITE='#ffffd8', RIM='#b47810';

  // Coin body using circle math
  const cx=16,cy=16,r=13.5;
  for(let y=0;y<32;y++) for(let x=0;x<32;x++){
    const dx=x-cx+.5, dy=y-cy+.5, dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<=r){
      const edge = r - dist;
      if(edge < 1.5) px(x,y,MID);
      else px(x,y,GOLD);
    }
  }
  // Shadow left/bottom
  for(let y=0;y<32;y++) for(let x=0;x<32;x++){
    const dx=x-cx+.5, dy=y-cy+.5, dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<=r && dist>r-1.5 && (dx<0||dy>0)) px(x,y,SHADOW);
  }
  // Shine top-left
  for(let y=2;y<14;y++) for(let x=2;x<14;x++){
    const dx=x-cx+.5, dy=y-cy+.5, dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<=r-1 && x<cx-1 && y<cy-1) px(x,y,SHINE);
  }
  // Specular
  for(let y=4;y<8;y++) for(let x=4;x<8;x++){
    const dx=x-cx+.5, dy=y-cy+.5, dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<=r-2 && x<cx-3 && y<cy-3) px(x,y,WHITE);
  }
  // Kanji 円 style
  const D=DARK, L=LIGHT;
  // Top bar
  for(let x=11;x<21;x++) px(x,10,D);
  // Second bar
  for(let x=11;x<21;x++) px(x,13,D);
  // Left vertical
  for(let y=10;y<22;y++) px(11,y,D);
  // Right vertical
  for(let y=10;y<22;y++) px(20,y,D);
  // Bottom bar
  for(let x=11;x<21;x++) px(x,21,D);
  // Center vertical
  for(let y=13;y<22;y++) px(15,y,D);
  // Inner fill
  for(let y=11;y<13;y++) for(let x=12;x<20;x++) px(x,y,L);
  for(let y=14;y<21;y++) for(let x=12;x<15;x++) px(x,y,L);
  for(let y=14;y<21;y++) for(let x=16;x<20;x++) px(x,y,L);
})();

function fmtS(s){
  if(s<60)return s+'秒';
  const m=Math.floor(s/60),r=s%60;
  if(s<3600)return m+'分'+(r?r+'秒':'');
  return Math.floor(s/3600)+'時'+Math.floor((s%3600)/60)+'分';
}
function getRand(){
  const r=Math.random();
  if(r<0.005)return Math.floor(Math.random()*9001)+1000;
  if(r<0.05)return Math.floor(Math.random()*451)+50;
  if(r<0.3)return Math.floor(Math.random()*19)+10;
  return Math.floor(Math.random()*9)+1;
}

// ── FLOAT TEXT ─────────────────────────────────────────
function spawnFloat(el, amt, isJack){
  const rect = el.getBoundingClientRect();
  const span = document.createElement('span');
  span.className = 'float-txt';
  span.textContent = '+'+fmt(amt);
  span.style.left = (rect.left + rect.width/2 + (Math.random()-.5)*50 - 25)+'px';
  span.style.top = (rect.top - 10)+'px';
  if(isJack){span.style.color='#ff9944';span.style.fontSize='22px';}
  document.body.appendChild(span);
  setTimeout(()=>span.remove(), 900);
}

function showToast(msg, green){
  const d=document.createElement('div');
  d.className='toast'+(green?' green':'');
  d.textContent=msg;
  document.body.appendChild(d);
  setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity .3s';setTimeout(()=>d.remove(),300);},2200);
}

  {id:'a6',cat:'afk',icon:'💤',name:'睡著了嗎',desc:'單次掛機超30分鐘',b:'bafk',check:s=>s.afkMaxSession>=1800},
  {id:'a7',cat:'afk',icon:'🏧',name:'自動提款機',desc:'掛機總收入超$10,000',b:'bafk',check:s=>s.afkTotalEarned>=10000},
  {id:'a8',cat:'afk',icon:'💰',name:'睡後賺錢',desc:'掛機總收入超$100,000',b:'bafk',check:s=>s.afkTotalEarned>=100000},
  {id:'a9',cat:'afk',icon:'🎰',name:'掛機大獎',desc:'掛機期間獲得大獎',b:'bafk',check:s=>s.afkJackpots>=1},
  {id:'a10',cat:'afk',icon:'🎆',name:'掛機連莊',desc:'掛機期間3次以上大獎',b:'bafk',check:s=>s.afkJackpots>=3},
];
const TOTAL = ACHS.length;

// ── LOAD/SAVE ──────────────────────────────────────────
function saveGame(){
  try{localStorage.setItem('cg_state',JSON.stringify(G));localStorage.setItem('cg_unlocked',JSON.stringify([...unlocked]));}catch(e){}
}
function loadGame(){
  try{
    const gs=localStorage.getItem('cg_state');
    const gu=localStorage.getItem('cg_unlocked');
    if(gs){const p=JSON.parse(gs);Object.assign(G,p);}
    if(gu){JSON.parse(gu).forEach(id=>unlocked.add(id));}
  }catch(e){}
}
loadGame();

// ── CORE ───────────────────────────────────────────────
function addAmt(amt, isAfk){
  const isJack = amt>=1000;
  G.total+=amt;
  if(amt>G.bestSingle)G.bestSingle=amt;
  G.streak++;
  if(amt>=50)G.bigStreak++;else G.bigStreak=0;
  if(amt>=10)G.tenPlusStreak++;else G.tenPlusStreak=0;
  if(amt>=5)G.fivePlusStreak++;else G.fivePlusStreak=0;
  if(amt===1)G.gotOneDollar=true;
  const tr=Math.round(G.total);
  if(tr%100===0&&tr>0)G.exactHundred=true;
  if(amt>=100)G.hundredStreak++;else G.hundredStreak=0;
  if(G.hundredStreak>=3)G.tripleHundred=true;
  const now=Date.now(),min=Math.floor(now/60000);
  if(isJack){
    G.jackpots++;G.jackpotTotal+=amt;G.jackpotStreak++;
    G.consecutiveJackpots++;
    if(G.consecutiveJackpots>=2)G.doubleJackpot=true;
    if(min===G.lastJackpotMinute)G.sameMinuteJackpot++;else G.sameMinuteJackpot=1;
    G.lastJackpotMinute=min;
    if(!isAfk&&G.clicks<=5)G.jackpotIn5=true;
    if(isAfk){G.afkJackpots++;afkJacks++;}
  }else{G.jackpotStreak=0;G.consecutiveJackpots=0;}
  history.unshift({amount:amt,time:new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),src:isAfk?'掛機':'點擊'});
  if(history.length>60)history.pop();
  return isJack;
}

function checkAch(){
  G.unlockedCount=unlocked.size;
  let news=[];
  ACHS.forEach(a=>{if(!unlocked.has(a.id)&&a.check(G)){unlocked.add(a.id);news.push(a);}});
  G.unlockedCount=unlocked.size;
  news.forEach(a=>showToast(a.icon+' 成就解鎖：'+a.name));
  document.getElementById('s-ach').textContent=unlocked.size+'/'+TOTAL;
  if(currentTab==='ach')renderAch();
}

function updateStats(){
  document.getElementById('s-total').textContent=fmt(G.total);
  document.getElementById('s-clicks').textContent=G.clicks.toLocaleString();
  document.getElementById('s-ach').textContent=unlocked.size+'/'+TOTAL;
  document.getElementById('s-twd').textContent='NT$'+G.twdTotal.toLocaleString();
  if(currentTab==='exchange')updateExPanel();
}

// ── CLICK ──────────────────────────────────────────────
document.getElementById('coin-btn').addEventListener('click', function(e){
  const now=Date.now(), amt=getRand();
  G.clicks++;
  if(G.clicks===1)G.fastClick=true;
  if(G.clicks===2&&G.lastClickTime>0&&(now-G.lastClickTime)>30000)G.slowClick=true;
  if(G.lastClickTime>0&&(now-G.lastClickTime)>60000)G.verySlowClick=true;
  G.recentClickTimes=G.recentClickTimes.filter(t=>now-t<1000);
  G.recentClickTimes.push(now);
  if(G.recentClickTimes.length>G.rapidClicks)G.rapidClicks=G.recentClickTimes.length;
  if(G.minClickStart===0)G.minClickStart=now;
  const el=(now-G.minClickStart)/60000;
  if(el<=1)G.minClickCount++;else{G.minClickStart=now;G.minClickCount=1;}
  if(G.minClickCount>G.clicksPerMin)G.clicksPerMin=G.minClickCount;
  if(G.clicks<=3)G.first3amounts.push(amt);
  if(G.first3amounts.length===3)G.first3done=true;
  if(!G.sixthCheck&&G.clicks===6&&G.first3amounts.length>=5){
    if(G.first3amounts.slice(0,5).every(v=>v===1)&&amt>=1000)G.sixthJackpot=true;
    G.sixthCheck=true;
  }
  if(G.clicks<=10){let s=history.slice(0,9).reduce((a,h)=>a+h.amount,0)+amt;if(s>=1000)G.richIn10=true;}
  const isJack=addAmt(amt,false);
  G.lastClickTime=now;
  spawnFloat(this,amt,isJack);
  if(isJack){
    const b=document.getElementById('jackpot-banner');
    b.style.display='block';clearTimeout(b._t);
    b._t=setTimeout(()=>b.style.display='none',2000);
  }
  updateStats();checkAch();
  document.getElementById('combo-bar').textContent=G.streak>=10?'🔥 連擊 '+G.streak+' 次！':'';
  renderMiniHistory();
  if(currentTab==='hist')renderHist();
  saveGame();
});

function renderMiniHistory(){
  document.getElementById('mini-history').innerHTML=history.slice(0,5).map(h=>{
    let cls=h.amount>=1000?'jp':h.amount>=50?'big':'';
    let lbl=h.amount>=1000?'🎉':h.amount>=50?'✨':'·';
    return `<div class="mini-hist-item"><span>${lbl} ${h.time}</span><span class="mh-amt ${cls}">${fmt(h.amount)}</span></div>`;
  }).join('');
}

// ── AFK ────────────────────────────────────────────────
function selPreset(idx,val){
  selPresetIdx=idx;
  [0,1,2].forEach(i=>document.getElementById('dur-'+i).classList.toggle('sel',i===idx));
  const cr=document.getElementById('custom-row');
  if(val===-1){cr.style.display='flex';afkDuration=parseInt(document.getElementById('custom-dur').value);}
  else{cr.style.display='none';afkDuration=val;}
}
function updateCustomLbl(){
  const v=parseInt(document.getElementById('custom-dur').value);
  document.getElementById('custom-lbl').textContent=fmtS(v);
  if(selPresetIdx===2)afkDuration=v;
}
function toggleAfk(){if(afkTimer){stopAfk();return;}startAfk();}
function startAfk(){
  afkElapsed=0;afkEarned=0;afkJacks=0;afkLog=[];
  document.getElementById('result-card').style.display='none';
  document.getElementById('afk-prog-wrap').style.display='block';
  document.getElementById('afk-btn').textContent='⏹ 停止掛機';
  document.getElementById('afk-btn').classList.add('running');
  afkTimer=setInterval(afkTick,1000);
}
function afkTick(){
  afkElapsed++;
  const amt=getRand(), isJack=addAmt(amt,true);
  afkEarned+=amt;G.afkTotalEarned+=amt;
  afkLog.unshift({amt,isJack,t:afkElapsed});
  if(afkLog.length>20)afkLog.pop();
  updateStats();checkAch();updateAfkUI();
  if(currentTab==='hist')renderHist();
  if(afkElapsed>=afkDuration)finishAfk();
  saveGame();
}
function updateAfkUI(){
  const pct=Math.min(100,Math.round(afkElapsed/afkDuration*100));
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('afk-left').textContent='剩餘 '+fmtS(Math.max(0,afkDuration-afkElapsed));
  document.getElementById('afk-status').textContent='掛機中… '+pct+'%';
  document.getElementById('afk-earn').textContent=fmt(afkEarned);
  document.getElementById('afk-el').textContent=fmtS(afkElapsed);
  document.getElementById('afk-jk').textContent=afkJacks;
  document.getElementById('afk-log').innerHTML=afkLog.slice(0,6).map(l=>`<div class="afk-log-row"><span>${fmtS(l.t)} ${l.isJack?'🎉':l.amt>=50?'✨':''}</span><span class="la ${l.isJack?'jp':l.amt>=50?'big':''}">${fmt(l.amt)}</span></div>`).join('');
}
function stopAfk(){if(!afkTimer)return;clearInterval(afkTimer);afkTimer=null;finalizeAfk();}
function finishAfk(){clearInterval(afkTimer);afkTimer=null;finalizeAfk();}
function finalizeAfk(){
  G.afkSessions++;G.afkTotalSecs+=afkElapsed;
  if(afkElapsed>G.afkMaxSession)G.afkMaxSession=afkElapsed;
  document.getElementById('afk-btn').textContent='▶ 開始掛機';
  document.getElementById('afk-btn').classList.remove('running');
  document.getElementById('prog-fill').style.width='100%';
  document.getElementById('afk-left').textContent='已完成';
  document.getElementById('afk-status').textContent='掛機結束！';
  document.getElementById('res-earn').textContent=fmt(afkEarned);
  document.getElementById('res-ticks').textContent=afkElapsed;
  document.getElementById('res-jk').textContent=afkJacks;
  document.getElementById('result-card').style.display='block';
  checkAch();updateStats();saveGame();
}

// ── EXCHANGE ───────────────────────────────────────────
function updateExPanel(){
  const conv=Math.floor(G.total/RATE);
  document.getElementById('ex-balance').textContent=fmt(G.total);
  document.getElementById('ex-conv').textContent='NT$'+conv.toLocaleString();
  document.getElementById('twd-total').textContent='NT$'+G.twdTotal.toLocaleString();
  updateExPrev();
}
function updateExPrev(){
  const val=parseInt(document.getElementById('ex-input').value)||0;
  const max=Math.floor(G.total/RATE);
  const btn=document.getElementById('ex-btn');
  const prev=document.getElementById('ex-prev');
  if(val<=0){prev.textContent='請輸入兌換數量';btn.disabled=true;return;}
  if(val>max){prev.innerHTML=`金額不足，最多可兌換 <span>NT$${max.toLocaleString()}</span>`;btn.disabled=true;return;}
  prev.innerHTML=`花費 <span>${fmt(val*RATE)}</span> → 獲得 <span>NT$${val.toLocaleString()}</span>`;
  btn.disabled=false;
}
function exMax(){
  document.getElementById('ex-input').value=Math.floor(G.total/RATE);
  updateExPrev();
}
function doExchange(){
  const val=parseInt(document.getElementById('ex-input').value)||0;
  const max=Math.floor(G.total/RATE);
  if(val<=0||val>max)return;
  const cost=val*RATE;
  G.total-=cost;G.twdTotal+=val;
  exHistory.unshift({twd:val,cost,time:new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'})});
  document.getElementById('ex-input').value='';
  updateStats();updateExPanel();renderExHist();
  showToast('💱 兌換成功！獲得 NT$'+val.toLocaleString(), true);
  saveGame();
}
function renderExHist(){
  if(!exHistory.length){document.getElementById('ex-hist').style.display='none';return;}
  document.getElementById('ex-hist').style.display='block';
  document.getElementById('ex-hist-list').innerHTML=exHistory.slice(0,10).map(h=>`<div class="ex-hist-row"><span>${h.time} — ${fmt(h.cost)}</span><span class="eha">+NT$${h.twd.toLocaleString()}</span></div>`).join('');
}

// ── TAB SWITCH ─────────────────────────────────────────
function switchTab(tab){
  currentTab=tab;
  const names=['game','afk','exchange','ach','hist'];
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',names[i]===tab));
  names.forEach(n=>document.getElementById('panel-'+n).classList.toggle('show',n===tab));
  if(tab==='ach'){G.tabSwitches++;renderAch();checkAch();}
  if(tab==='hist')renderHist();
  if(tab==='exchange'){updateExPanel();renderExHist();}
}

// ── RENDER ACHIEVEMENTS ────────────────────────────────
function renderAch(){
  const cats=['all','click','money','jackpot','streak','special','combo','afk'];
  const cn={all:'全部',click:'點擊',money:'金錢',jackpot:'大獎',streak:'連擊',special:'特殊',combo:'組合',afk:'掛機'};
  document.getElementById('ach-filters').innerHTML=cats.map(c=>`<button class="af-btn${currentFilter===c?' active':''}" onclick="setFilter('${c}')">${cn[c]}</button>`).join('');
  const list=ACHS.filter(a=>currentFilter==='all'||a.cat===currentFilter);
  document.getElementById('ach-prog').textContent=`已解鎖 ${unlocked.size} / ${TOTAL} 個成就`;
  const cl={click:'點擊',money:'金錢',jackpot:'大獎',streak:'連擊',special:'特殊',combo:'組合',afk:'掛機'};
  document.getElementById('ach-grid').innerHTML=list.map(a=>{
    const u=unlocked.has(a.id);
    return `<div class="ach-card ${u?'unlocked':'locked'}"><div class="ai">${a.icon}</div><div class="an">${a.name}</div><div class="ad">${a.desc}</div><span class="ab ${a.b}">${cl[a.cat]}</span></div>`;
  }).join('');
}
function setFilter(f){currentFilter=f;renderAch();}

// ── RENDER HISTORY ─────────────────────────────────────
function renderHist(){
  document.getElementById('hist-list').innerHTML=history.slice(0,40).map(h=>{
    let cls=h.amount>=1000?'jp':h.amount>=50?'big':'';
    let lbl=h.amount>=1000?'🎉 大獎':h.amount>=50?'✨ 好運':'普通';
    let tag=h.src==='掛機'?'<span class="hist-tag">掛機</span>':'';
    return `<div class="hist-row"><span>${tag}${h.time} — ${lbl}</span><span class="hist-amt ${cls}">${fmt(h.amount)}</span></div>`;
  }).join('');
}

// ── RESET ──────────────────────────────────────────────
function resetGame(){
  if(afkTimer){clearInterval(afkTimer);afkTimer=null;}
  const rs=(G.resets||0)+1;
  G={total:0,clicks:0,bestSingle:0,jackpots:0,streak:0,bigStreak:0,tenPlusStreak:0,fivePlusStreak:0,jackpotStreak:0,fastClick:false,exactHundred:false,slowClick:false,verySlowClick:false,tabSwitches:0,doubleJackpot:false,gotOneDollar:false,rapidClicks:0,resets:rs,sameMinuteJackpot:0,clicksPerMin:0,richIn10:false,jackpotIn5:false,tripleHundred:false,sixthJackpot:false,jackpotTotal:0,first3done:false,unlockedCount:0,lastJackpotMinute:-1,lastClickTime:0,consecutiveJackpots:0,first3amounts:[],sixthCheck:false,hundredStreak:0,recentClickTimes:[],minClickCount:0,minClickStart:0,afkSessions:0,afkTotalSecs:0,afkMaxSession:0,afkTotalEarned:0,afkJackpots:0,twdTotal:0};
  history=[];exHistory=[];unlocked.clear();afkLog=[];afkEarned=0;afkJacks=0;afkElapsed=0;
  updateStats();renderMiniHistory();
  document.getElementById('jackpot-banner').style.display='none';
  document.getElementById('combo-bar').textContent='';
  document.getElementById('afk-prog-wrap').style.display='none';
  document.getElementById('result-card').style.display='none';
  document.getElementById('afk-btn').textContent='▶ 開始掛機';
  document.getElementById('afk-btn').classList.remove('running');
  document.getElementById('ex-input').value='';
  document.getElementById('ex-hist').style.display='none';
  if(currentTab==='ach')renderAch();
  if(currentTab==='hist')renderHist();
  if(currentTab==='exchange')updateExPanel();
  saveGame();
}

// ── INIT ───────────────────────────────────────────────
updateStats();
renderMiniHistory();
renderAch();

// ── PWA INSTALL ────────────────────────────────────────
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-banner').classList.add('show');
});
document.getElementById('install-btn').addEventListener('click', async () => {
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  const {outcome} = await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('install-banner').classList.remove('show');
});
window.addEventListener('appinstalled', () => {
  document.getElementById('install-banner').classList.remove('show');
});

// ── SERVICE WORKER ─────────────────────────────────────
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
